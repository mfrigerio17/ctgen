[project]

name        = "ctgen"
version     = "0.3.0"
description = "Coordinate-transforms code generator"
authors     = [
    { name = "Marco Frigerio", email = "mfgit.6uvfu@passinbox.com" }
]

license = "BSD-3-Clause"
readme = "readme.md"

requires-python = ">=3.9"

dependencies = [
    "numpy",
    "sympy",
    "lupa",
    "pyyaml",
    "kgprim >= 0.1.1"
]

[project.urls]
Homepage   = "https://github.com/mfrigerio17/ctgen"
Repository = "https://github.com/mfrigerio17/ctgen"

[project.scripts]
ctgen = "ctgen.gen:main"


[tool.setuptools]

packages = ["ctgen", "ctgen_backends.cpp_iitrbd", "ctgen_backends.octave", "ctgen_backends.plaintext"]

[tool.setuptools.package-dir]

ctgen = "src/ctgen"
"ctgen_backends.cpp_iitrbd" = "backends/cpp_iitrbd/src/ctgen_backends/cpp_iitrbd"
"ctgen_backends.octave"     = "backends/octave/src/ctgen_backends/octave"
"ctgen_backends.plaintext"  = "backends/plaintext/src/ctgen_backends/plaintext"

# What I would like to do is:
## [tool.setuptools]
## packages = ["ctgen", "ctgen_backends"]
##
## [tool.setuptools.package-dir]
## ctgen = "src/ctgen"
## ctgen_backends = ["backends/cpp_iitrbd/src/ctgen_backends/", "backends/octave/src/ctgen_backends/", ...]
#
# that is, specify only the root namespace package, and include subpackages and
# modules that are stored in separate folders.


[tool.setuptools.package-data]

"*" = ["*.lua", "*/*.lua"]
